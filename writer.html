<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writer’s Desk — Nusaiba</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="writer.css"></head><body>
<header><a href="index.html#thoughts">← Return to the bookshelf</a><span>NNZ / WRITER’S DESK</span></header>
<main><section class="intro"><p class="kicker">A QUIET PLACE TO BEGIN</p><h1>Write a new page.</h1><p>Nothing is sent anywhere. This desk turns your writing into one small file that you upload to the correct book folder on GitHub.</p></section>
<form id="writerForm"><div class="fields"><label>Book<select id="book"><option value="building">Building</option><option value="understanding">Understanding</option><option value="remembering">Remembering</option><option value="reciting">Reciting · আবৃত্তি</option><option value="reading">Reading</option><option value="making">Making</option><option value="cooking">Cooking</option><option value="becoming">Becoming</option></select></label><label>Title<input id="title" required placeholder="The name of this page"></label><label>Date<input id="date" type="date" required></label><label>Kind of page<input id="type" placeholder="Reflection, recipe, project story…"></label><label class="wide">Short introduction<input id="summary" required placeholder="One sentence visitors will see before opening it"></label><label>Language<select id="language"><option value="en">English</option><option value="bn">বাংলা</option></select></label><label>Optional image path<input id="image" placeholder="assets/my-photo.jpg"></label></div><label class="writing">Your page<textarea id="body" required placeholder="Write here…"></textarea></label><div class="actions"><button type="button" id="template">Insert a helpful template</button><button type="submit" class="download">Download page file ↓</button></div><p id="instruction" class="instruction" aria-live="polite"></p></form></main>
<script src="writer.js"></script></body></html>
